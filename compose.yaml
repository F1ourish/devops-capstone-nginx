services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    image: devops-capstone-nginx:local
    ports:
      - "8080:80"
    environment:
      TZ: "Europe/Moscow"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1/healthz 2>/dev/null | grep -qx 'ok' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
