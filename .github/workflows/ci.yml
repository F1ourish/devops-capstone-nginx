name: CI - Compose Nginx

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamlint
        run: |
          set -euo pipefail
          python3 -m pip install --user yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: YAML lint (relaxed)
        run: |
          set -euo pipefail
          yamllint -d relaxed .

      - name: Validate Compose file
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker compose config

  compose-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Build and start
        run: |
          set -euo pipefail
          docker compose up -d --build

      - name: Validate nginx config (nginx -t)
        run: |
          set -euo pipefail
          docker compose exec -T nginx nginx -t

      - name: Wait for healthcheck
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q nginx)"
          echo "nginx container id: $cid"

          for i in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done

          echo "Timed out waiting for healthy"
          docker compose ps
          docker compose logs --tail 200 nginx
          docker inspect --format='{{json .State.Health}}' "$cid" || true
          exit 1

      - name: Verify /healthz body
        run: |
          set -euo pipefail
          body=""
          for i in {1..5}; do
            if body="$(curl -fsS http://127.0.0.1:8080/healthz)"; then
              break
            fi
            sleep 1
          done

          echo "body='$body'"
          [ "$body" = "ok" ] || exit 1

      - name: Compose status
        if: always()
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 nginx

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
